generer_oppgjor:
  fields:
    periode:
      required: false
      example: "2026-11"
      selector:
        text:
    tving:
      required: false
      default: false
      selector:
        boolean:
    send_epost:
      required: false
      default: true
      selector:
        boolean:

godkjenn_oppgjor:
  fields:
    periode:
      required: true
      example: "2026-11"
      selector:
        text:

send_epost_pa_nytt:
  fields:
    periode:
      required: true
      example: "2026-11"
      selector:
        text:

sett_status:
  fields:
    periode:
      required: true
      example: "2026-11"
      selector:
        text:
    status:
      required: true
      selector:
        select:
          options:
            - betalt
            - ikke_betalt
            - unntak_ikke_betalt

publiser_side:

slett_periode:
  fields:
    periode:
      required: true
      example: "2026-11"
      selector:
        text:
    bekreft:
      required: true
      default: false
      selector:
        boolean:

ny_leietaker:

send_lenke:

merk_betalt:
  fields:
    periode:
      required: false
      example: "2026-10"
      selector:
        text:

sett_malerstand:
  fields:
    dato:
      required: true
      example: "2026-12-01"
      selector:
        text:
    stand:
      required: true
      example: 250.4
      selector:
        number:
          min: 0
          max: 100000000
          step: 0.001
          mode: box
          unit_of_measurement: kWh
    maaler:
      required: false
      default: leilighet
      selector:
        select:
          options:
            - leilighet
            - lader

send_regnskap:
  fields:
    periode:
      required: false
      example: "2026-10"
      selector:
        text:
